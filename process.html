<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Process - WebForge</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:linear-gradient(135deg,#06121f,#082f49,#164e63);
    overflow-x:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.3;
    z-index:-1;
    animation:float 7s ease-in-out infinite alternate;
}

body::before{
    background:#06b6d4;
    top:-100px;
    left:-80px;
}

body::after{
    background:#f59e0b;
    right:-100px;
    bottom:-100px;
    animation-delay:2s;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(35px);}
}

.topbar{
    height:70px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,.2);
    border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#22d3ee;
}

.back{
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    font-size:14px;
    transition:.3s;
}

.back:hover{
    background:#0891b2;
    border-color:#0891b2;
    transform:translateY(-2px);
}

.container{
    width:90%;
    max-width:900px;
    margin:55px auto;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:8px 17px;
    border-radius:30px;
    background:rgba(34,211,238,.1);
    border:1px solid rgba(34,211,238,.3);
    color:#67e8f9;
    font-size:13px;
    margin-bottom:18px;
}

h1{
    font-size:44px;
    margin-bottom:12px;
}

.subtitle{
    color:#bae6fd;
    font-size:16px;
    margin-bottom:40px;
}

.process{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.step{
    position:relative;
    padding:28px 22px;
    border-radius:22px;
    text-align:left;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px);
    transition:.35s;
    animation:show .7s ease both;
}

.step:nth-child(2){animation-delay:.1s;}
.step:nth-child(3){animation-delay:.2s;}
.step:nth-child(4){animation-delay:.3s;}
.step:nth-child(5){animation-delay:.4s;}
.step:nth-child(6){animation-delay:.5s;}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.step:hover{
    transform:translateY(-7px);
    border-color:#22d3ee;
    background:rgba(8,145,178,.14);
}

.number{
    position:absolute;
    top:15px;
    right:18px;
    font-size:13px;
    color:#67e8f9;
    font-weight:bold;
}

.icon{
    font-size:32px;
    margin-bottom:14px;
}

.step h3{
    font-size:17px;
}

@media(max-width:650px){
    h1{
        font-size:34px;
    }

    .process{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 5%;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">Web<span>Forge</span></div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>
</div>

<div class="container">

    <div class="badge">How We Work</div>

    <h1>Work Process</h1>

    <p class="subtitle">
        A simple process from project request to final delivery.
    </p>

    <div class="process">

        <div class="step">
            <div class="number">01</div>
            <div class="icon">📨</div>
            <h3>Project Request</h3>
        </div>

        <div class="step">
            <div class="number">02</div>
            <div class="icon">🤝</div>
            <h3>Requirement Discussion</h3>
        </div>

        <div class="step">
            <div class="number">03</div>
            <div class="icon">💻</div>
            <h3>Design & Development</h3>
        </div>

        <div class="step">
            <div class="number">04</div>
            <div class="icon">🔍</div>
            <h3>Testing</h3>
        </div>

        <div class="step">
            <div class="number">05</div>
            <div class="icon">🚀</div>
            <h3>Final Delivery</h3>
        </div>

        <div class="step">
            <div class="number">06</div>
            <div class="icon">🛠️</div>
            <h3>Support & Updates</h3>
        </div>

    </div>

</div>

</body>
</html>
