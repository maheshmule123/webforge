<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebForge | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 20%,rgba(99,102,241,.22),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(6,182,212,.20),transparent 30%),
        #080c18;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.45;
    animation:float 8s ease-in-out infinite;
}

.orb.one{
    width:180px;
    height:180px;
    background:#6366f1;
    top:-70px;
    left:-50px;
}

.orb.two{
    width:220px;
    height:220px;
    background:#06b6d4;
    right:-90px;
    bottom:-80px;
    animation-delay:2s;
}

.orb.three{
    width:90px;
    height:90px;
    background:#ec4899;
    right:20%;
    top:12%;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(25px,-25px);
    }
}

.brand{
    position:absolute;
    top:25px;
    left:35px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
    z-index:5;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 0 25px rgba(99,102,241,.45);
    animation:logoPulse 3s ease-in-out infinite;
}

.logo svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:white;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.brand span{
    color:#22d3ee;
}

@keyframes logoPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

.container{
    width:100%;
    max-width:1050px;
    min-height:620px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:45px;
    padding:35px;
    position:relative;
    z-index:2;
}

.intro{
    padding:20px;
    animation:slideLeft .8s ease;
}

@keyframes slideLeft{
    from{
        opacity:0;
        transform:translateX(-40px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    border-radius:30px;
    color:#a5f3fc;
    font-size:13px;
    margin-bottom:22px;
}

.badge i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow:0 0 12px #22d3ee;
}

.intro h1{
    font-size:48px;
    line-height:1.08;
    margin-bottom:18px;
}

.gradient-text{
    background:linear-gradient(90deg,#818cf8,#22d3ee,#f472b6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:gradientMove 4s linear infinite;
}

@keyframes gradientMove{
    to{
        background-position:200% center;
    }
}

.intro p{
    color:#aab4ca;
    font-size:16px;
    line-height:1.7;
    max-width:470px;
}

.features{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.feature{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 13px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    color:#cbd5e1;
    font-size:13px;
}

.card{
    width:100%;
    max-width:470px;
    margin:auto;
    padding:32px;
    border-radius:25px;
    background:rgba(15,23,42,.72);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);
    animation:cardIn .9s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.card-head{
    text-align:center;
    margin-bottom:25px;
}

.user-icon{
    width:58px;
    height:58px;
    margin:0 auto 14px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        rgba(99,102,241,.25),
        rgba(6,182,212,.18)
    );
    border:1px solid rgba(103,232,249,.2);
}

.user-icon svg{
    width:29px;
    height:29px;
    fill:none;
    stroke:#67e8f9;
    stroke-width:1.8;
}

.card h2{
    font-size:25px;
    margin-bottom:6px;
}

.card-head p{
    color:#8995ab;
    font-size:13px;
}

.form-group{
    margin-bottom:16px;
    position:relative;
}

.form-group label{
    display:block;
    font-size:12px;
    color:#b8c2d4;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:17px;
    height:17px;
    stroke:#718096;
    fill:none;
    stroke-width:1.8;
    pointer-events:none;
    transition:.3s;
}

input{
    width:100%;
    height:48px;
    padding:0 14px 0 43px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.10);
    outline:none;
    background:rgba(255,255,255,.045);
    color:white;
    font-size:14px;
    transition:.3s;
}

input::placeholder{
    color:#667085;
}

input:focus{
    border-color:#22d3ee;
    background:rgba(34,211,238,.055);
    box-shadow:0 0 0 3px rgba(34,211,238,.08);
}

.input-wrap:focus-within svg{
    stroke:#22d3ee;
}

.login-btn{
    width:100%;
    height:50px;
    margin-top:5px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    color:white;
    font-size:15px;
    font-weight:700;
    background:linear-gradient(90deg,#6366f1,#06b6d4);
    box-shadow:0 12px 30px rgba(6,182,212,.18);
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 35px rgba(6,182,212,.30);
}

.login-btn:active{
    transform:scale(.98);
}

.register-text{
    text-align:center;
    margin-top:19px;
    color:#7f8ba1;
    font-size:13px;
}

.register-text a{
    color:#67e8f9;
    text-decoration:none;
    font-weight:600;
}

.register-text a:hover{
    text-decoration:underline;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#64748b;
    text-decoration:none;
    font-size:12px;
}

.home-link:hover{
    color:#cbd5e1;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:10px 12px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.25);
    color:#fca5a5;
}

@media(max-width:850px){

    body{
        overflow:auto;
    }

    .brand{
        top:18px;
        left:20px;
    }

    .container{
        grid-template-columns:1fr;
        padding:95px 20px 30px;
        gap:20px;
    }

    .intro{
        text-align:center;
        padding:10px;
    }

    .intro h1{
        font-size:36px;
    }

    .intro p{
        margin:auto;
    }

    .features{
        justify-content:center;
    }

    .card{
        max-width:500px;
    }
}

@media(max-width:480px){

    .intro{
        display:none;
    }

    .container{
        padding:85px 15px 25px;
    }

    .card{
        padding:25px 20px;
        border-radius:20px;
    }

    .card h2{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="brand">

    <div class="logo">
        <svg viewBox="0 0 24 24">
            <path d="M7 4L3 12L7 20"/>
            <path d="M17 4L21 12L17 20"/>
            <path d="M14 3L10 21"/>
        </svg>
    </div>

    Web<span>Forge</span>

</div>

<div class="container">

    <section class="intro">

        <div class="badge">
            <i></i>
            Welcome Back
        </div>

        <h1>
            Continue with<br>
            <span class="gradient-text">WebForge.</span>
        </h1>

        <p>
            Login to your WebForge account and manage
            your website projects, services and freelance
            work from one place.
        </p>

        <div class="features">

            <div class="feature">
                💻 Projects
            </div>

            <div class="feature">
                🌐 Web Services
            </div>

            <div class="feature">
                🚀 Grow
            </div>

        </div>

    </section>

    <section class="card">

        <div class="card-head">

            <div class="user-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 20C5.8 16.4 8.1 14.5 12 14.5C15.9 16.4 18.2 18.4 19 20"/>
                </svg>
            </div>

            <h2>Welcome Back</h2>
            <p>Login to your WebForge account</p>

        </div>

        <div class="message" id="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email Address</label>

                <div class="input-wrap">

                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 7L12 13L21 7"/>
                    </svg>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="input-wrap">

                    <svg viewBox="0 0 24 24">
                        <rect x="5" y="10" width="14" height="10" rx="2"/>
                        <path d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"/>
                    </svg>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>

            <button type="submit" class="login-btn">
                Login →
            </button>

        </form>

        <div class="register-text">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <a href="index.html" class="home-link">
            ← Back to Home
        </a>

    </section>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const savedUser =
        localStorage.getItem("webforgeUser");

    if(!savedUser){

        message.style.display = "block";
        message.textContent =
            "No account found. Please create an account first.";

        return;
    }

    const user = JSON.parse(savedUser);

    if(
        email.toLowerCase() === user.email.toLowerCase() &&
        password === user.password
    ){

        localStorage.setItem("webforgeLoggedIn","true");

        window.location.href = "dashboard.html";

    }else{

        message.style.display = "block";
        message.textContent =
            "Invalid email or password.";

    }

});

</script>

</body>
</html>
